<!doctype html><meta charset="utf-8"><title>Demo capture</title>
<style>body{font:20px system-ui;background:#f5f8fd;color:#00142b;margin:64px}button{font:inherit;padding:16px 24px;margin:8px;border:1px solid #187adc;border-radius:8px;background:white;color:#0051af}#status{margin:24px 8px}a{display:block;margin:24px 8px}</style>
<h1>Demo capture</h1><p>Select the clean Chrome guide window. This recording stays on this computer.</p>
<button id="start">Start recording</button><button id="stop" disabled>Stop and save</button><div id="status">Ready</div><div id="downloads"></div>
<script>
const captureStart=document.getElementById('start'),captureStop=document.getElementById('stop'),captureStatus=document.getElementById('status'),captureDownloads=document.getElementById('downloads');let stream,recorder,chunks=[];
captureStart.onclick=async()=>{try{stream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always',frameRate:30},audio:false});chunks=[];const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:20000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='demo-capture-'+Date.now()+'.webm';a.textContent='Download recording';captureDownloads.append(a);captureStatus.textContent='Capture saved in this browser. Download it below.';stream.getTracks().forEach(t=>t.stop());captureStart.disabled=false;captureStop.disabled=true};recorder.start(1000);captureStart.disabled=true;captureStop.disabled=false;document.getElementById('status').textContent='Recording '+stream.getVideoTracks()[0].label;stream.getVideoTracks()[0].onended=()=>{if(recorder.state==='recording')recorder.stop()};}catch(e){document.getElementById('status').textContent=e.message}};
captureStop.onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop()};
</script>
